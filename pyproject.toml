[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-grimm-tales"
version = "0.2.0"
description = "Brothers Grimm fairy tales provider for ovos-common-reading-pipeline-plugin. No standalone voice interface."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "emkay-voice"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "skill", "voice", "assistant", "fairytales", "grimm", "storytelling", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Home Automation",
]
dependencies = [
    "ovos-workshop>=0.0.15,<10.0.0",
    "requests",
    "bs4",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-skill-grimm-tales"
Issues = "https://github.com/emkay-voice/ovos-skill-grimm-tales/issues"
Emkay = "https://github.com/emkay-voice/emkay"
Icon = "https://raw.githubusercontent.com/emkay-voice/ovos-skill-grimm-tales/main/story-512.png"

[project.entry-points."opm.skill"]
"ovos-skill-grimm-tales.emkay-voice" = "ovos_skill_grimm_tales:GrimmTales"

[tool.setuptools]
packages = ["ovos_skill_grimm_tales"]

[tool.setuptools.package-dir]
ovos_skill_grimm_tales = ""

[tool.setuptools.package-data]
ovos_skill_grimm_tales = ["locale/**/*", "*.png"]
